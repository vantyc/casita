# ROLLBACK: Nginx apunta a Tomcat nativo (8080) en lugar de Docker (8081)
# Redirigir HTTP a HTTPS
server {
    listen 80;
    server_name lacasitadelpan.com www.lacasitadelpan.com;
    return 301 https://$host$request_uri;
}

# HTTPS con Let's Encrypt - backend Tomcat NATIVO (8080)
server {
    listen 443 ssl;
    server_name lacasitadelpan.com www.lacasitadelpan.com;

    ssl_certificate     /etc/letsencrypt/live/lacasitadelpan.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lacasitadelpan.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Redirigir /casita (sin barra) a /casita/
    location = /casita {
        return 301 https://$host/casita/;
    }

    # ClickOnce: archivos estáticos en /casita
    location /casita/ {
        alias /var/www/casita/;
    }

    location /lcp/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
